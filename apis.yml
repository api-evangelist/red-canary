apis:
- name: Red Canary REST API v3
  description: 'Tenant-scoped REST API over the Red Canary portal. Documented resources
    include detections, threats, events, endpoints, endpoint_users, identities, investigations
    and audit_logs. Requests carry a per-user API token in the X-Api-Key header. Responses
    use a JSON:API-flavored envelope of meta / links / data, with page, per_page and
    direction pagination parameters. Rate limited to roughly 20 requests per minute
    and 10 requests per second per IP address.'
  humanURL: https://docs.redcanary.com/docs/red-canary-rest-api
