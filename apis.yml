aid: red-canary
name: Red Canary
description: 'Red Canary is a Managed Detection and Response (MDR) provider that monitors
  endpoint, identity, cloud, email and network telemetry on behalf of its customers,
  confirms threats with a 24x7 human and AI detection engineering team, and drives
  containment through automation playbooks and response actions across partner platforms
  such as Microsoft Defender, CrowdStrike Falcon, SentinelOne, Palo Alto Cortex, Carbon
  Black and Zscaler. The company also publishes widely used open-source security research
  including Atomic Red Team, Chain Reactor, Surveyor and the annual Threat Detection
  Report. Red Canary was acquired by Zscaler in 2025. It operates a tenant-scoped REST
  API (openapi/v3) over detections, threats, events, endpoints, endpoint users, identities,
  investigations and audit logs, authenticated with a per-user X-Api-Key token; the
  Swagger/OpenAPI reference for that API is served inside the customer portal and is
  not reachable without a tenant subdomain and login.'
