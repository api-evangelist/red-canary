notes: >-
  Red Canary publishes ONE first-party API client library, and it ships from GitHub
  source only — it is not on PyPI, npm, RubyGems, Maven Central, NuGet, pkg.go.dev,
  Packagist or crates.io (all probed 2026-08-05, all 404). The REST API FAQ states
  plainly that no packaged SDKs are provided; the docs instead publish copy-paste
  quickstarts in Python, Ruby, Go, curl and PowerShell.
packages:
- language: python
  registry: github
  name: redcanary
  version: '0.4'
  url: https://github.com/redcanaryco/openapi
  install: git clone https://github.com/redcanaryco/openapi && cd openapi/python && python setup.py install
  license: MIT
  official: true
  maintainer_email: opensource@redcanary.com
  covers:
  - detections
  - detectors
  note: >-
    Wraps https://<subdomain>.my.redcanary.co/openapi/v3/ with X-Api-Key auth and
    automatic page-through of the meta.total_items envelope. Configured with the
    RED_CANARY_CUSTOMER_ID and RED_CANARY_AUTH_TOKEN environment variables.
